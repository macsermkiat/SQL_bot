<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KCMH Hospital Analytics SQL Bot">
    <title>{% block title %}KCMH SQL Bot{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/space-theme.css?v=3">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <canvas id="starfield" aria-hidden="true"></canvas>

    {% block content %}{% endblock %}

    <script src="/static/js/stars-animation.js?v=3"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
