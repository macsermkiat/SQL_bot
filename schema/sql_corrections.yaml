# SQL Corrections - Learned patterns from past query failures
# These are proven fixes discovered through production usage.
# The learning_store.py captures raw patterns; proven ones graduate here.
#
# Format:
#   <pattern_id>:
#     tables: [affected tables]
#     wrong: "what the LLM tends to generate incorrectly"
#     right: "the correct approach"
#     reason: "why it's wrong"
#
# To add: run `python -m app.learning_store graduate` to promote
# high-confidence patterns from out/learned_patterns.jsonl into this file.

procedure_icd9cm_missing_names:
  tables: ["IPTSUMOPRT", "ICD9CM"]
  wrong: >
    SELECT CASE WHEN "icd9cm" = '4701' THEN 'Laparoscopic' ... END
    (hardcoding procedure names from icd9cm codes)
  right: >
    JOIN "KCMH_HIS"."ICD9CM" ic ON op."icd9cm" = ic."icd9cm"
    then use ic."name" or ic."thainame" for procedure names
  reason: >
    IPTSUMOPRT has icd9cm codes but often no procedure names.
    Always JOIN ICD9CM reference table to get name/thainame.
    Never hardcode procedure names from ICD codes.

procedure_incpt_masterorder_coverage:
  tables: ["INCPT", "MASTERORDER", "IPTSUMOPRT"]
  wrong: >
    Using only IPTSUMOPRT or PTICD9CM for procedure counts
  right: >
    UNION IPTSUMOPRT (ICD-9-CM based) with INCPT JOIN MASTERORDER
    (charge-based) for comprehensive procedure coverage.
    INCPT.ordercode = MASTERORDER.ordercode, then filter by
    MASTERORDER.name_en or MASTERORDER.name with LIKE.
  reason: >
    Some procedures appear in charge records (INCPT+MASTERORDER)
    but not in IPTSUMOPRT ICD-9-CM records. Combining both sources
    gives more complete procedure counts.

procedure_pticd9cm_not_primary:
  tables: ["PTICD9CM", "IPTSUMOPRT"]
  wrong: >
    Using PTICD9CM as primary source for inpatient procedure queries
  right: >
    Use IPTSUMOPRT as primary source for inpatient ICD-9-CM procedures.
    PTICD9CM is supplementary (covers OPD+IPD but less reliable for IPD).
  reason: >
    IPTSUMOPRT is the medical records summary and the authoritative
    source for inpatient procedure codes. PTICD9CM can miss IPD entries.

ovstpress_multi_condition_join:
  tables: ["OVST", "OVSTPRESS"]
  wrong: >
    LEFT JOIN OVSTPRESS o2 ON o2.hn = o.hn
    (joining blood pressure table on hn alone)
  right: >
    LEFT JOIN OVSTPRESS o2
      ON o2.hn = o.hn
     AND o2.vstdate = o.vstdate
     AND o2.vsttime = o.vsttime
     AND o2.cliniclct = o.cliniclct
  reason: >
    OVSTPRESS has no surrogate PK; multiple rows exist per vstdate across
    different times and clinics. Joining on hn alone fan-outs OVST rows
    and inflates counts. Always include vstdate + vsttime + cliniclct.

lvstexm_self_join_panel_keys:
  tables: ["LVSTEXM"]
  wrong: >
    LEFT JOIN LVSTEXM l2 ON l2.hn = l.hn AND l2.lvstdate = l.lvstdate
    (self-join for lab panel pivot missing labgrp)
  right: >
    LEFT JOIN LVSTEXM l2
      ON l2.hn = l.hn AND l2.lvstdate = l.lvstdate AND l2.labgrp = l.labgrp
  reason: >
    Must include labgrp to stay within one panel order. Without it, tests
    from different panels on the same day bleed into each other. Add
    lvsttime only as a tie-breaker for repeat panels on the same day.

age_at_event_postgres:
  tables: ["PT", "OVST", "PTDIAG", "IPT"]
  wrong: >
    TRUNC(MONTHS_BETWEEN(SYSDATE, t.brthdate)/12) AS age  -- Oracle only
  right: >
    DATE_PART('year', AGE(p.vstdate, t.brthdate))::int AS age_at_visit
    -- For IPD use dchdate or rgtdate instead of vstdate
  reason: >
    Production DB is PostgreSQL. SYSDATE, MONTHS_BETWEEN, and TRUNC are
    Oracle-only functions and will fail. Use AGE(event_date, brthdate)
    with the appropriate event date: vstdate for OPD, dchdate or rgtdate
    for IPD.

opd_visit_filter_pattern:
  tables: ["OVST"]
  wrong: >
    WHERE vstdate BETWEEN '2025-01-01' AND '2025-12-31'
    (no cancellation or IPD-row exclusion)
  right: >
    WHERE vstdate BETWEEN '2025-01-01' AND '2025-12-31'
      AND canceldate IS NULL
      AND an IS NULL
  reason: >
    OVST contains both OPD visits and IPD admission registration rows.
    canceldate IS NULL excludes cancelled visits (staff corrections).
    AN IS NULL is required to filter OPD-only rows; rows with an non-NULL
    are IPD admission records, not outpatient visits.
