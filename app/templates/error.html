{% extends "base.html" %}

{% block title %}{{ status_code }} - KCMH SQL Bot{% endblock %}
{% block body_class %}login-page{% endblock %}

{% block content %}
<main class="login-container">
    <div class="login-card login-card--centered">
        <div class="login-header">
            <h1>{{ status_code }}</h1>
            <p>{{ message }}</p>
        </div>
        <a href="{{ redirect_url }}" class="login-button login-button--link" role="button">
            {{ button_text }}
        </a>
    </div>
</main>
{% endblock %}
