emergency_visit:
  description: "Emergency/ER visit routing"
  tables:
    - "CNER"
    - "OVST"
  notes: >
    CRITICAL: Emergency/ER visits -> use CNER table (NOT OVST.emrgncy).
    OVST.emrgncy is just an urgency triage level field, NOT an ER indicator.
    CNER contains actual ER visit records with triage, chief complaint, disposition.

delivery_birth:
