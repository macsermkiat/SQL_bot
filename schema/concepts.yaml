# Clinical Concept Definitions for KCMH SQL Bot
# These mappings help translate clinical questions into SQL conditions

diabetes_icd10:
  description: "Diabetes mellitus (ICD-10 E10-E14)"
  condition: "icd10 LIKE 'E1%' AND icd10 >= 'E10' AND icd10 < 'E15'"
  icd10_codes:
    - "E10"  # Type 1 diabetes
    - "E11"  # Type 2 diabetes
    - "E12"  # Malnutrition-related diabetes
    - "E13"  # Other specified diabetes
    - "E14"  # Unspecified diabetes
  tables:
    - "PTDIAG"
    - "IPTSUMDIAG"
  notes: "Use >= and < for range to handle subcodes like E11.9"

diabetes_type1:
  description: "Type 1 Diabetes mellitus (ICD-10 E10)"
  condition: "icd10 LIKE 'E10%'"
  icd10_codes:
    - "E10"
  tables:
    - "PTDIAG"
    - "IPTSUMDIAG"

diabetes_type2:
  description: "Type 2 Diabetes mellitus (ICD-10 E11)"
  condition: "icd10 LIKE 'E11%'"
  icd10_codes:
    - "E11"
  tables:
    - "PTDIAG"
    - "IPTSUMDIAG"

hypertension:
  description: "Essential hypertension (ICD-10 I10-I15)"
  condition: "icd10 LIKE 'I1%' AND icd10 >= 'I10' AND icd10 < 'I16'"
  icd10_codes:
    - "I10"  # Essential (primary) hypertension
    - "I11"  # Hypertensive heart disease
    - "I12"  # Hypertensive renal disease
    - "I13"  # Hypertensive heart and renal disease
    - "I15"  # Secondary hypertension
  tables:
    - "PTDIAG"
    - "IPTSUMDIAG"

thyroid_function_test:
  description: "Thyroid function test bundle (FT3, FT4, TSH)"
  tests:
    - "FT3"
    - "FT4"
    - "TSH"
    - "Free T3"
    - "Free T4"
  bundle_logic: "same_visit"
  tables:
    - "LABEXM"
  notes: "Bundle = all three tests ordered in same visit (vn)"

complete_blood_count:
  description: "Complete Blood Count (CBC)"
  tests:
    - "CBC"
    - "Hb"
    - "Hct"
    - "WBC"
    - "Platelet"
  tables:
    - "LABEXM"

lipid_profile:
  description: "Lipid profile panel"
  tests:
    - "Total Cholesterol"
    - "Triglyceride"
    - "HDL"
    - "LDL"
    - "VLDL"
  bundle_logic: "same_visit"
  tables:
    - "LABEXM"

kidney_function:
  description: "Kidney function tests"
  tests:
    - "BUN"
    - "Creatinine"
    - "eGFR"
  tables:
    - "LABEXM"

liver_function:
  description: "Liver function tests"
  tests:
    - "AST"
    - "ALT"
    - "ALP"
    - "Total Bilirubin"
    - "Direct Bilirubin"
    - "Albumin"
  tables:
    - "LABEXM"

lab_result_lookup:
  description: "Lab result queries - use LVSTEXM directly, not LVST"
  tables:
    - "LVSTEXM"
    - "LABEXM"
  notes: >
    CRITICAL: LVSTEXM has hn, lvstdate, labexm, result, an, labno - everything needed for lab queries.
    Do NOT join LVST header table unless you specifically need LVST-only columns (e.g., dct, lrfrlct).
    WRONG: LVST lv JOIN LVSTEXM lexm ON lv."labno" = lexm."labno" (unnecessary join, and labno relationship is ambiguous)
    RIGHT: Query LVSTEXM directly with date filter on lvstdate.
    To find lab test codes: SELECT labexm FROM LABEXM WHERE LOWER(labname) LIKE '%hba1c%' (dynamic, never hardcode).
    Numeric results: result column is TEXT. Always validate before CAST:
    CASE WHEN lexm."result" ~ '^[0-9]+(\.[0-9]+)?$' THEN CAST(lexm."result" AS NUMERIC) END

medication_lookup:
  description: "Drug/medication lookup from MEDITEMDIS table"
  tables:
    - "MEDITEMDIS"
    - "PRSCDT"
    - "PRSC"
  notes: >
    CRITICAL column mapping for MEDITEMDIS (do NOT guess column names):
    meditem = medication item code (PK, numeric). Join via PRSCDT.meditem.
    medname = drug/medication name (ชื่อยา/เวชภัณฑ์) [text] - PRIMARY search field.
    medcode = drug code [text].
    chemname = chemical name (ชื่อทางเคมี) [text].
    prscname = prescription name (ชื่อสั่งยา) [text].
    tradename = trade name (ชื่อการค้า) [text].
    strength = drug strength [text].
    printnmth = Thai drug name [text].
    WARNING: There is NO column called "name" in MEDITEMDIS. Use "medname" for drug name searches.
    WARNING: brandname is NUMERIC - do NOT use LIKE on it.
    Prescription chain: PRSC (prescription header, has hn/prscdate) -> PRSCDT (prescription detail, has meditem) -> MEDITEMDIS (drug master, has medname).
    CRITICAL JOIN RULE: PRSC to PRSCDT must join on BOTH prscno AND sphmlct (pharmacy unit code).
    WRONG: PRSC.prscno = PRSCDT.prscno AND PRSC.prvno = PRSCDT.prvno
    RIGHT: PRSC.prscno = PRSCDT.prscno AND PRSC.sphmlct = PRSCDT.sphmlct
    prvno is an authorization reference, NOT a join key. sphmlct distinguishes pharmacy units.

icd_code_format:
  description: "ICD code storage format in this database"
  notes: >
    CRITICAL: ICD-9-CM codes in icd9cm columns are stored WITHOUT dots/periods.
    Standard '47.01' is stored as '4701'. Standard '47.09' is stored as '4709'.
    When filtering: use LIKE '470%' NOT LIKE '47.0%'.
    Examples: appendectomy = '4701','4709' (LIKE '470%'). Cholecystectomy = '5121','5122' (LIKE '512%').
    This applies to ALL tables with icd9cm column: IPTSUMOPRT, PTICD9CM, PTOPRT, ICD9CM, OPRTACT.

surgery_inpatient:
  description: "Inpatient surgery/procedure lookup and emergency surgery identification"
  tables:
    - "IPTSUMOPRT"
    - "ICD9CM"
    - "INCPT"
    - "MASTERORDER"
    - "PTOPRT"
    - "OPREQVST"
  notes: >
    CRITICAL TABLE SELECTION for procedure queries:
    - IPTSUMOPRT: PRIMARY source for inpatient procedure ICD-9-CM codes. Medical records summary. Join IPT via an.
      Columns: an, icd9cm, oprtcnt, oprtside, orflag. NO date columns - use IPT.dchdate or IPT.rgtdate for dates.
      IMPORTANT: IPTSUMOPRT has icd9cm codes but often WITHOUT procedure names.
      Always JOIN ICD9CM table to get the procedure name:
      IPTSUMOPRT.icd9cm = ICD9CM.icd9cm -> ICD9CM.name (English), ICD9CM.thainame (Thai).
    - ICD9CM: Reference table for ICD-9-CM procedure codes. Has name, thainame, icd10tm, orflag (1=surgical).
      ALWAYS join this to get human-readable procedure names from IPTSUMOPRT codes.
    - INCPT: Charge/expense table. Use INCPT.ordercode to JOIN MASTERORDER for procedure identification.
      Procedures that may not appear in IPTSUMOPRT can be found via INCPT charge codes.
      INCPT has hn, an, vn, incdate - provides patient and date context.
      For complete procedure counts, combine IPTSUMOPRT (ICD-9-CM based) with INCPT+MASTERORDER (charge-based).
    - MASTERORDER: Master registry of charge items (ทะเบียนรายการค่ารักษา).
      Key columns: ordercode (PK), name (Thai), name_en (English), income (charge key code).
      JOIN: INCPT.ordercode = MASTERORDER.ordercode to get procedure/item names.
      Use MASTERORDER.name or name_en with LIKE to identify specific procedures by charge code.
    - PTOPRT: transactional procedure records with oprtact code and actual times (oprtdatein/oprtdateout). Join IPT via an. WARNING: PTOPRT.icd9cm is mostly EMPTY - do NOT rely on it for ICD-9-CM lookups.
    - OPREQVST: OR scheduling with optype (1=Elective, 2=Emergency), estmdate (surgery date). Join IPT via an.
    For OPD procedures, or if not sure if it's OPD or IPD, use PTICD9CM.icd9cm (can link with hn and an).
    On PTICD9CM: AN IS NULL identifies OPD-context procedures; AN IS NOT NULL identifies IPD-context.
    CRITICAL: For ICD-9-CM procedure code lookups, ALWAYS use IPTSUMOPRT.icd9cm as primary source (NOT PTOPRT.icd9cm which is mostly empty). PTICD9CM can be used as supplementary.
    CRITICAL: icd9cm codes have NO dots. Use '470%' not '47.0%' for appendectomy.
    COMPREHENSIVE PROCEDURE QUERY PATTERN (best coverage):
    ```sql
    -- Source 1: ICD-9-CM based (IPTSUMOPRT + ICD9CM for names)
    SELECT ipt."hn", ipt."dchdate" AS proc_date, ic."name" AS proc_name, 'ICD9CM' AS source
    FROM "KCMH_HIS"."IPTSUMOPRT" op
    INNER JOIN "KCMH_HIS"."IPT" ipt ON op."an" = ipt."an"
    INNER JOIN "KCMH_HIS"."ICD9CM" ic ON op."icd9cm" = ic."icd9cm"
    WHERE op."icd9cm" LIKE '470%'
    UNION ALL
    -- Source 2: Charge-based (INCPT + MASTERORDER for names)
    SELECT inc."hn", inc."incdate" AS proc_date, mo."name_en" AS proc_name, 'CHARGE' AS source
    FROM "KCMH_HIS"."INCPT" inc
    INNER JOIN "KCMH_HIS"."MASTERORDER" mo ON inc."ordercode" = mo."ordercode"
    WHERE LOWER(mo."name_en") LIKE '%appendectomy%' OR LOWER(mo."name") LIKE '%ไส้ติ่ง%'
    ```
    IPT.receiveflag is NOT populated - do not use it for ER identification.
    For emergency vs elective surgery, use OPREQVST.optype = 2 (Emergency).
    LOS calculation: IPT.dchdate::date - IPT.rgtdate::date.
    

opd_visit:
  description: "Outpatient department visit"
  tables:
    - "OVST"
  notes: "Primary key is vn (visit number)"

ipd_admission:
  description: "Inpatient admission"
  tables:
    - "IPT"
  notes: "Primary key is an (admission number)"


blood_pressure_vital:
  description: "Blood pressure measurement from vital signs (OVSTPRESS table)"
  tables:
    - "OVSTPRESS"
  notes: >
    CRITICAL column mapping for OVSTPRESS (do NOT guess column names):
    hbpn = systolic blood pressure (ความดันสูง, e.g. 120 mmHg).
    lbpn = diastolic blood pressure (ความดันต่ำ, e.g. 80 mmHg).
    Hypertension criteria: hbpn >= 140 OR lbpn >= 90.
    WARNING: 'ps' is PAIN SCORE (not pressure systolic). 'pd' does NOT exist.
    Join to OVST via vn for visit details. Join to PT via hn for patient counts.
    Always filter by vstdate or prdate for performance.

vital_signs:
  description: "Vital signs measurement (OVSTPRESS table column reference)"
  tables:
    - "OVSTPRESS"
  notes: >
    OVSTPRESS column mapping (do NOT invent column names):
    hbpn = systolic blood pressure (ความดันสูง).
    lbpn = diastolic blood pressure (ความดันต่ำ).
    pr = pulse rate (อัตราการเต้นชีพจร).
    rr = respiratory rate (อัตราการหายใจ).
    bt = body temperature (อุณหภูมิร่างกาย).
    o2sat = oxygen saturation.
    ps = pain score (ระดับความรู้สึกปวด) - NOT blood pressure.
    weight = body weight (น้ำหนัก).
    height = body height (ส่วนสูง).
    dtx = blood sugar level (ระดับน้ำตาลในเลือด).
    hct = hematocrit (ความเข้มเม็ดเลือดแดง).
    prdate = date of measurement. vstdate = visit date.

antihypertensive_drug_classes:
  description: "Antihypertensive drug classification by pharmacological class"
  tables:
    - "MEDITEMDIS"
    - "PRSCDT"
    - "PRSC"
  notes: >
    When counting antihypertensive medications, count by DRUG CLASS (pharmacological group), NOT individual drug items.
    Major antihypertensive drug classes:
    1. ACE inhibitors (ACEi): enalapril, ramipril, lisinopril, captopril, perindopril
    2. ARBs: losartan, valsartan, irbesartan, telmisartan, candesartan, olmesartan
    3. Calcium Channel Blockers (CCB): amlodipine, nifedipine, felodipine, diltiazem, verapamil
    4. Diuretics: hydrochlorothiazide, furosemide, spironolactone, chlorthalidone, indapamide
    5. Beta-blockers: atenolol, metoprolol, propranolol, bisoprolol, carvedilol
    6. Alpha-blockers: prazosin, doxazosin
    7. Direct vasodilators: hydralazine, minoxidil
    8. Central alpha-agonists: methyldopa, clonidine
    To classify drugs, use MEDITEMDIS.chemname or MEDITEMDIS.tradename with LIKE matching per class.
    Example: LOWER(m."chemname") LIKE '%amlodipine%' OR LOWER(m."tradename") LIKE '%amlodipine%' -> class 'CCB'.
    Use a CASE expression to assign drug class, then COUNT(DISTINCT drug_class).

concurrent_medication:
  description: "How to count concurrent (simultaneous) medications vs any-time medications"
  tables:
    - "PRSC"
    - "PRSCDT"
  notes: >
    CRITICAL: When a clinical question asks for patients on >= N drugs "at a time" or "simultaneously",
    you must count drugs prescribed in the SAME VISIT (same vn or same prscno), NOT just any drugs
    received at any point during the year.
    WRONG approach: COUNT all distinct drugs across the entire year (a patient who switched from drug A
    to drug B and then to drug C would count as 3 drugs, but was never on all 3 simultaneously).
    RIGHT approach: For each prescription (prscno) or visit (vn), count the distinct drug classes.
    Then check if ANY single prescription/visit has >= N classes.
    Pattern for concurrent drugs:
    ```sql
    SELECT p."hn", p."prscno", COUNT(DISTINCT drug_class) AS class_count
    FROM "KCMH_HIS"."PRSC" p
    INNER JOIN "KCMH_HIS"."PRSCDT" pd ON p."prscno"=pd."prscno" AND p."sphmlct"=pd."sphmlct"
    ...
    GROUP BY p."hn", p."prscno"
    HAVING COUNT(DISTINCT drug_class) >= 3
    ```
    This ensures the patient was prescribed >= 3 classes in a single prescription event.

resistant_hypertension:
  description: "Resistant hypertension - uncontrolled BP despite >= 3 antihypertensive drug classes"
  condition: "icd10 LIKE 'I10%'"
  icd10_codes:
    - "I10"
  tables:
    - "PTDIAG"
    - "PRSC"
    - "PRSCDT"
    - "MEDITEMDIS"
    - "OVSTPRESS"
  notes: >
    Resistant hypertension definition: BP remains >= 140/90 mmHg despite concurrent use of >= 3
    different antihypertensive drug CLASSES (not individual drugs).
    CRITICAL requirements:
    1. Count drug CLASSES (ACEi, ARB, CCB, diuretic, beta-blocker, etc.), not individual drug items.
       Use CASE on chemname/tradename to classify, then COUNT(DISTINCT class).
    2. The >= 3 classes must be CONCURRENT (same prescription/visit), not cumulative over the year.
       A patient who tried drug A, then switched to B, then C is NOT resistant - they were never on all 3 at once.
    3. BP measurement (OVSTPRESS.hbpn >= 140) should be AFTER or DURING treatment period.
       Join OVSTPRESS to the prescription via date: BP measurement date >= prescription date.
       This ensures we measure BP while the patient is actually on the medications.
    4. Use PRSC-PRSCDT join with BOTH prscno AND sphmlct (never prvno).

temporal_drug_condition:
  description: "Temporal relationship between drug prescriptions and clinical events"
  tables:
    - "PRSC"
    - "PRSCDT"
    - "IPT"
    - "OVST"
  notes: >
    CRITICAL: When a question implies a temporal relationship between medications and events,
    you MUST enforce the correct time ordering with date filters.
    Common patterns:
    1. "already on drug X" / "ได้รับยา X อยู่แล้ว" = prescription date BEFORE the event.
       Filter: p."prscdate" < (first event date for that patient).
       Example: inhaler prescribed BEFORE first COPD admission.
    2. "despite treatment" / "แม้ได้รับการรักษา" = measurement AFTER/DURING treatment.
       Filter: measurement date >= prescription date.
    3. "after starting drug X" = event date > first prescription date of drug X.
    Pattern for "already on drug before event":
    ```sql
    WHERE p."prscdate" < (SELECT MIN(i."rgtdate") FROM ... WHERE i."hn" = p."hn")
    ```
    Do NOT omit date filters when temporal language is present in the question.
    A query with no date constraint on the drug check answers "ever received" not "already on".

copd_exacerbation:
  description: "COPD with acute exacerbation identification"
  condition: "icd10 LIKE 'J44%'"
  icd10_codes:
    - "J44"
    - "J44.0"
    - "J44.1"
  tables:
    - "PTDIAG"
    - "IPTSUMDIAG"
    - "IPT"
  notes: >
    COPD = ICD-10 J44 (all subcodes). Use LIKE 'J44%', do NOT hardcode individual subcodes.
    J44.0 = COPD with acute lower respiratory infection.
    J44.1 = COPD with acute exacerbation (most specific for "acute exacerbation").
    For "acute exacerbation admissions", use IPT + IPTSUMDIAG with J44.1 (or J44.0/J44.1 if broader).
    For general COPD, use J44%.

